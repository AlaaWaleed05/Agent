name: Fix worker fallback architecture

on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch worker
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('worker.py')
          s = p.read_text(encoding='utf-8')

          s = s.replace('import requests\n', '')
          s = s.replace('BASE_URL = "https://apiadm.study-in-egypt.gov.eg/api"\n', '')

          start = s.find('# ============================================================\n# RELIABLE HTTP FALLBACK FOR A STUDENT')
          if start != -1:
              end = s.find('# ============================================================\n# SELENIUM', start)
              if end == -1:
                  raise SystemExit('Could not find end of HTTP fallback section')
              s = s[:start] + s[end:]

          marker = '            # ====================================================\n            # TECHNICAL FAILURE\n'
          old_start = s.find(marker)
          if old_start == -1:
              raise SystemExit('Could not find technical failure block')
          old_end = s.find('            # ====================================================\n            # SAVE TO SUPABASE\n', old_start)
          if old_end == -1:
              raise SystemExit('Could not find end of technical failure block')

          new_block = '''            # ====================================================\n            # TECHNICAL FAILURE\n            #\n            # A Selenium failure is NEVER sent to the API here.\n            # Queue the student for one Selenium-only retry pass\n            # at the end of this job.\n            # ====================================================\n\n            if technical_error:\n\n                status = TECH_FAILURE_STATUS\n                retry_students.append((index, student, name))\n\n                print(\n                    f"⚠️ Technical error for {name}: "\n                    f"{technical_error}; queued for Selenium retry pass"\n                )\n\n                needs_browser_restart = False\n\n'''
          s = s[:old_start] + new_block + s[old_end:]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        run: |
          python -m py_compile worker.py
          if grep -nE 'legacy_check_student_status|_legacy_api_|^BASE_URL[[:space:]]*=|^import requests$|HTTP fallback succeeded' worker.py; then
            echo 'HTTP/API fallback still exists in worker.py'
            exit 1
          fi
          grep -n 'retry_students.append' worker.py
          grep -n 'TECH_FAILURE_STATUS' worker.py

      - name: Commit application change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.py
          if git diff --cached --quiet; then
            echo 'No worker changes needed.'
            exit 0
          fi
          git commit -m 'Remove per-student API fallback from worker'
          git push
