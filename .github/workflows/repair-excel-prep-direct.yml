name: Repair Aivora Excel preparation

on:
  push:
    branches: [main]
    paths:
      - "scripts/repair_excel_prep.py"
      - ".github/workflows/repair-excel-prep-direct.yml"
      - ".github/excel_repair_trigger.txt"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply repair
        run: python scripts/repair_excel_prep.py

      - name: Validate Python files
        run: |
          python -m py_compile "streamlit_app (7).py"
          python -m py_compile worker.py

      - name: Commit repaired app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "streamlit_app (7).py"
          git rm -f scripts/repair_excel_prep.py .github/workflows/repair-excel-prep-direct.yml .github/excel_repair_trigger.txt || true
          git commit -m "Repair Excel job preparation" || exit 0
          git push origin main
