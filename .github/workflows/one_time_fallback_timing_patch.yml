name: One-time fallback timing patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply fallback timing patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch fallback timing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('streamlit_app (7).py')
          s = p.read_text(encoding='utf-8')

          needle = 'WORKER_WAIT_SECONDS = 30\nTECH_FAILURE_STATUS = "تعذر فحص الطالب حاليًا"'
          repl = '''WORKER_WAIT_SECONDS = 30
          # Keep fallback pacing aligned with the Worker timing policy.
          LOGIN_PAGE_DELAY_MIN, LOGIN_PAGE_DELAY_MAX = 0.8, 1.5
          POST_LOGIN_DELAY_SECONDS = 1.0
          INBOX_DELAY_MIN, INBOX_DELAY_MAX = 0.7, 1.5
          STUDENT_DELAY_MIN, STUDENT_DELAY_MAX = 4, 8
          TECH_FAILURE_STATUS = "تعذر فحص الطالب حاليًا"'''
          if needle not in s:
              raise SystemExit('timing constants insertion point not found')
          s = s.replace(needle, repl, 1)

          needle = '''def safe_log(message):
              print(f"[Aivora] {message}")
          '''
          repl = '''def safe_log(message):
              print(f"[Aivora] {message}")


          def fallback_delay(a, b):
              """Use the same timing ranges as worker.py without touching Streamlit state."""
              import random
              time.sleep(random.uniform(a, b))
          '''
          if needle not in s:
              raise SystemExit('fallback_delay insertion point not found')
          s = s.replace(needle, repl, 1)

          old = '''                    password = Fernet(key.encode()).decrypt(str(student["encrypted_password"]).encode()).decode()
                      session, token, error = _legacy_api_login(str(student["login_identifier"]).strip(), password)
                      if error:
                          status = "فشل تسجيل الدخول"
                      else:
                          status = _legacy_api_get_status(session, token)'''
          new = '''                    password = Fernet(key.encode()).decrypt(str(student["encrypted_password"]).encode()).decode()

                      # Match the Worker's login-page pacing before starting the login request.
                      fallback_delay(LOGIN_PAGE_DELAY_MIN, LOGIN_PAGE_DELAY_MAX)
                      session, token, error = _legacy_api_login(str(student["login_identifier"]).strip(), password)
                      if error:
                          status = "فشل تسجيل الدخول"
                      else:
                          # The Worker waits for the login transition before opening inbox.
                          time.sleep(POST_LOGIN_DELAY_SECONDS)
                          # Match the Worker's inbox navigation delay before reading status.
                          fallback_delay(INBOX_DELAY_MIN, INBOX_DELAY_MAX)
                          status = _legacy_api_get_status(session, token)'''
          if old not in s:
              raise SystemExit('fallback API flow insertion point not found')
          s = s.replace(old, new, 1)

          needle = '''            finally:
                  _legacy_api_logout(session)

              stamp = now_iso()'''
          repl = '''            finally:
                  _legacy_api_logout(session)
                  if session is not None:
                      # Match the Worker's post-logout pause.
                      fallback_delay(INBOX_DELAY_MIN, INBOX_DELAY_MAX)

              stamp = now_iso()'''
          if needle not in s:
              raise SystemExit('logout timing insertion point not found')
          s = s.replace(needle, repl, 1)

          needle = '''            except Exception as exc:
                  safe_log(f"fallback persistence error for {name}: {exc}")

          client.table("jobs").update'''
          repl = '''            except Exception as exc:
                  safe_log(f"fallback persistence error for {name}: {exc}")

              # Same 4–8 second pause used by the Worker between students.
              if index < total:
                  fallback_delay(STUDENT_DELAY_MIN, STUDENT_DELAY_MAX)

          client.table("jobs").update'''
          if needle not in s:
              raise SystemExit('student delay insertion point not found')
          s = s.replace(needle, repl, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        run: python -m py_compile 'streamlit_app (7).py'

      - name: Commit patched app and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'streamlit_app (7).py'
          git rm .github/workflows/one_time_fallback_timing_patch.yml
          git commit -m 'Apply fallback timing patch'
          git push
