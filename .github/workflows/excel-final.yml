name: Excel final patch
on:
  push:
    branches: [main]
    paths:
      - '.github/excel_final_trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply worker Excel patch
        run: python .github/worker_excel_patch.py
      - name: Validate
        run: |
          python -m py_compile 'streamlit_app (7).py'
          python -m py_compile worker.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.py
          git rm -f .github/excel_final_trigger.txt .github/worker_excel_patch.py 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Fix Excel worker live status update [skip ci]'
          git push origin main
