name: Apply Aivora 30s fallback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - name: Patch Streamlit app
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'streamlit_app (7).py';
            const branch = context.ref.replace('refs/heads/', '');

            const file = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            const sha = file.data.sha;
            let text = Buffer.from(file.data.content, 'base64').toString('utf8');

            const marker = '# ==================== Legacy direct API fallback ====================';
            if (text.includes(marker)) {
              core.info('Fallback already present.');
            } else {
              text = text.replace('import re\nimport time', 'import json\nimport random\nimport re\nimport time\n\nimport requests', 1);

