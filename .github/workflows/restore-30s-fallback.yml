name: Aivora patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('streamlit_app (7).py')
          s = p.read_text(encoding='utf-8')

          # Remove dashboard summary UI and the top logout button.
          s = re.sub(
              r"# ==================== Dashboard ====================\n.*?st\.markdown\(f\"<div class='hero'.*?\",unsafe_allow_html=True\)\n\nstudents=get_students\(office_id\)\ncounts=.*?st\.markdown\(\"<div style='height:18px'></div>\",unsafe_allow_html=True\)\n",
              "",
              s,
              flags=re.S,
          )
          s = s.replace('if st.button("تسجيل الخروج",key="logout_main"): st.session_state.clear(); st.rerun()\n\n', '', 1)

          # Never unlock an update inside the same login session.
          s = s.replace(
              'st.info("🔒 تم تشغيل تحديث بالفعل في هذه الجلسة. لو عايزة تبدئي تحديث جديد، سجّلي خروج وادخلي تاني.")',
              'st.warning("🔒 في تحديث تم تشغيله بالفعل في الجلسة دي. لبدء تحديث جديد، لازم تسجّلي خروج وتدخلي تاني.")',
              1,
          )
          s = s.replace('                if st.button("إخفاء المهمة",key="hide_done"): st.session_state.active_job_id=None; st.session_state.update_locked=False; st.rerun()\n', '', 1)
          s = s.replace('                if st.button("إخفاء المهمة",key="hide_failed"): st.session_state.active_job_id=None; st.session_state.update_locked=False; st.rerun()\n', '', 1)

          # Add legacy API fallback helpers once.
          marker = '# ==================== LEGACY API FALLBACK 30S ===================='
          if marker not in s:
              s = s.replace('import re\nimport time', 'import json\nimport re\nimport time\n\nimport requests', 1)
              fallback = '''

# ==================== LEGACY API FALLBACK 30S ====================
BASE_URL = "https://apiadm.study-in-egypt.gov.eg/api"
SITE_URL = "https://admission.study-in-egypt.gov.eg"
WORKER_WAIT_SECONDS = 30


def _decrypt_pw(v):
    key = st.secrets.get("STUDENT_PASSWORD_ENCRYPTION_KEY", os.getenv("STUDENT_PASSWORD_ENCRYPTION_KEY"))
    if not key:
        raise RuntimeError("STUDENT_PASSWORD_ENCRYPTION_KEY مش موجود في Secrets.")
    return Fernet(key.encode()).decrypt(str(v).encode()).decode()


def _api_login(email, password):
    session = requests.Session()
    session.headers.update({
        "accept": "application/json, text/plain, */*",
        "accept-language": "ar",
        "device": "CITIZEN",
        "origin": SITE_URL,
        "referer": SITE_URL + "/",
        "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36",
        "content-type": "application/json",
    })
    r = session.post(f"{BASE_URL}/student/login", json={"email": email, "password": password}, timeout=30)
    if r.status_code not in (200, 201):
        return None, None, f"فشل اللوجين - كود: {r.status_code}"
    body = r.json() if r.content else {}
    token = body.get("token", "") or r.headers.get("x-csrf-token", "")
    return session, token, None


def _api_status(session, token):
    filt = {
        "where": {},
        "limit": 10,
        "offset": 0,
        "order": "statusUpdatedAt DESC",
        "fields": ["serviceSlug", "ID", "createdAt", "statusUpdatedAt", "activityId", "activityName"],
    }
    headers = {"x-csrf-token": token} if token else {}
    r = session.get(
        f"{BASE_URL}/dynamic_services/inbox",
        params={"filter": json.dumps(filt)},
        headers=headers,
        timeout=30,
    )
    if r.status_code not in (200, 304):
        return f"خطأ في جلب الحالة ({r.status_code})"
    result = (r.json().get("result") or [])
    if not result:
        return "مفيش طلبات"
    name = result[0].get("activityName", "غير محدد")
    mapping = {
        "قبول الفحص الفنى": "القبول المبدئي",
        "قبول الفحص الفني": "القبول المبدئي",
        "kb8ijfo8": "تم السداد",
        "تم السداد": "تم السداد",
        "تأكيد استلام الملف وصحة و اكتمال المستندات": "تأكيد استلام الملف وصحة واكتمال المستندات",
        "الانتظار مراجعة الطلب": "بانتظار مراجعة الطلب",
        "قبول من رئيس الادارة المركزية": "قبول من رئيس الإدارة المركزية",
    }
    return mapping.get(name, name)


def _api_logout(session):
    if session is None:
        return
    try:
        session.post(f"{BASE_URL}/student/logout", json={"redirectUrl": SITE_URL}, timeout=15)
    except Exception:
        pass


def _claim_fallback(job_id):
    rows = (
        db().table("jobs")
        .update({"status": "processing", "started_at": now_iso(), "claimed_by": "streamlit-fallback"})
        .eq("id", job_id)
        .eq("status", "pending")
        .select("*")
        .execute().data or []
    )
    return rows[0] if rows else None


def _run_fallback(job):
    students = (
        db().table("student_records")
        .select("*")
        .eq("office_id", job["office_id"])
        .eq("data_source_id", job["data_source_id"])
        .order("source_row_number")
        .execute().data or []
    )
    students = [
        x for x in students
        if str(x.get("application_status") or "").strip() not in FINAL_STATUSES
        and x.get("login_identifier")
        and x.get("encrypted_password")
    ]
    if not students:
        db().table("jobs").update({"status": "done", "finished_at": now_iso()}).eq("id", job["id"]).execute()
        return
    total = len(students)
    failed = 0
    for i, student in enumerate(students, 1):
        session = None
        status = "خطأ فني في الفحص"
        try:
            session, token, err = _api_login(student["login_identifier"], _decrypt_pw(student["encrypted_password"]))
            if err:
                status = "فشل تسجيل الدخول"
                failed += 1
            else:
                status = _api_status(session, token)
                if str(status).startswith("خطأ"):
                    failed += 1
        except Exception:
            failed += 1
        finally:
            _api_logout(session)
        stamp = now_iso()
        db().table("student_records").update({
            "application_status": status,
            "status_updated_at": stamp,
            "updated_at": stamp,
        }).eq("id", student["id"]).execute()
        db().table("job_progress").insert({
            "job_id": job["id"],
            "student_index": i,
            "total": total,
            "student_name": student.get("student_name") or student.get("login_identifier"),
            "status": status,
        }).execute()
    db().table("jobs").update({
        "status": "failed" if failed >= total else "done",
        "finished_at": now_iso(),
        "error": "فشل فني في كل الطلاب" if failed >= total else None,
    }).eq("id", job["id"]).execute()


def wait_for_worker_or_fallback(job_id):
    deadline = time.monotonic() + WORKER_WAIT_SECONDS
    box = st.empty()
    bar = st.progress(0.0)
    while time.monotonic() < deadline:
        job = get_job(job_id)
        if not job:
            bar.empty()
            box.error("المهمة اختفت من Supabase.")
            return "missing"
        if str(job.get("status") or "pending") != "pending":
            bar.empty()
            return "worker"
        elapsed = int(WORKER_WAIT_SECONDS - max(0, deadline - time.monotonic()))
        remaining = max(0, WORKER_WAIT_SECONDS - elapsed)
        box.info(f"بندور على الـ Worker... لو مش موجود، التحديث هيبدأ تلقائيًا بعد {remaining} ثانية.")
        bar.progress(min(elapsed / WORKER_WAIT_SECONDS, 1.0))
        time.sleep(2)
    claimed = _claim_fallback(job_id)
    bar.empty()
    if claimed:
        box.warning("الـ Worker ما استلمش المهمة خلال 30 ثانية — Streamlit بدأ التحديث بالطريقة القديمة.")
        _run_fallback(claimed)
        return "fallback"
    return "worker"
'''
              s = s.replace('# ==================== UI ====================', fallback + '\n# ==================== UI ====================', 1)

          # Route the update button through Worker-first, 30s fallback logic.
