name: Aivora patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Aivora dashboard
        shell: bash
        run: |
          python scripts/remove_aivora_dashboard.py
          python -m py_compile 'streamlit_app (7).py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'streamlit_app (7).py'
          git commit -m 'Remove Aivora dashboard' || true
          git push
