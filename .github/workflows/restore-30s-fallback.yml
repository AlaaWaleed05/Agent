# ==================== Legacy direct API fallback ====================
BASE_URL = "https://apiadm.study-in-egypt.gov.eg/api"
SITE_URL = "https://admission.study-in-egypt.gov.eg"
WORKER_WAIT_SECONDS = 30
FALLBACK_POLL_INTERVAL_SECONDS = 2

HEADERS_BASE = {
    "accept": "application/json, text/plain, */*",
    "accept-language": "ar",
    "device": "CITIZEN",
    "origin": SITE_URL,
    "referer": SITE_URL + "/",
    "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
    "content-type": "application/json",
}

def decrypt_student_password(encrypted_password):
    key = st.secrets.get("STUDENT_PASSWORD_ENCRYPTION_KEY", os.getenv("STUDENT_PASSWORD_ENCRYPTION_KEY"))
    if not key:
        raise RuntimeError("STUDENT_PASSWORD_ENCRYPTION_KEY مش موجود في Secrets.")
    return Fernet(key.encode()).decrypt(str(encrypted_password).encode()).decode()

def fallback_api_login(email, password, max_retries=3):
    last_error = None
    for attempt in range(1, max_retries + 1):
        try:
            session = requests.Session()
            session.headers.update(HEADERS_BASE)
            response = session.post(f"{BASE_URL}/student/login", json={"email": email, "password": password}, timeout=30)
            if response.status_code not in (200, 201):
                last_error = f"فشل اللوجين - كود: {response.status_code}"
                if response.status_code == 429 or response.status_code >= 500:
                    if attempt < max_retries:
                        time.sleep(2 * attempt)
                        continue
                return None, None, last_error
            body = response.json() if response.content else {}
            csrf_token = body.get("token", "") or response.headers.get("x-csrf-token", "")
            return session, csrf_token, None
        except (requests.exceptions.SSLError, requests.exceptions.ConnectionError, requests.exceptions.Timeout) as exc:
            last_error = str(exc)
            if attempt < max_retries:
                time.sleep(2 * attempt)
        except Exception as exc:
            return None, None, str(exc)
    return None, None, last_error or "فشل الاتصال بالموقع"

def fallback_api_status(session, csrf_token):
    filter_obj = {
        "where": {},
        "limit": 10,
        "offset": 0,
        "order": "statusUpdatedAt DESC",
        "fields": ["serviceSlug", "ID", "createdAt", "statusUpdatedAt", "activityId", "activityName"],
    }
    headers = {"x-csrf-token": csrf_token} if csrf_token else {}
    response = session.get(f"{BASE_URL}/dynamic_services/inbox", params={"filter": json.dumps(filter_obj)}, headers=headers, timeout=30)
    if response.status_code not in (200, 304):
        return f"خطأ في جلب الحالة ({response.status_code})"
    results = response.json().get("result", [])
    if not results:
        return "مفيش طلبات"
    translations = {
        "قبول الفحص الفنى": "القبول المبدئي",
        "قبول الفحص الفني": "القبول المبدئي",
        "kb8ijfo8": "تم السداد",
        "تم السداد": "تم السداد",
        "تأكيد استلام الملف وصحة و اكتمال المستندات": "تأكيد استلام الملف وصحة واكتمال المستندات",
        "الانتظار مراجعة الطلب": "بانتظار مراجعة الطلب",
        "قبول من رئيس الادارة المركزية": "قبول من رئيس الإدارة المركزية",
    }
    value = results[0].get("activityName", "غير محدد")
    return translations.get(value, value)

def fallback_api_logout(session):
    if session is None:
        return
    try:
        session.post(f"{BASE_URL}/student/logout", json={"redirectUrl": SITE_URL}, timeout=15)
    except Exception:
        pass

def claim_job_for_streamlit(job_id):
    rows = (
        db().table("jobs")
        .update({"status": "processing", "started_at": now_iso(), "claimed_by": "streamlit-fallback"})
        .eq("id", job_id)
        .eq("status", "pending")
        .select("*")
        .execute().data or []
    )
    return rows[0] if rows else None

def set_fallback_job_status(job_id, status, error=None):
    payload = {"status": status}
    if status in {"done", "failed"}:
        payload["finished_at"] = now_iso()
    if error:
        payload["error"] = str(error)[:1000]
    db().table("jobs").update(payload).eq("id", job_id).execute()

def process_job_with_streamlit_fallback(job):
    job_id = str(job["id"])
    query = db().table("student_records").select("*").eq("office_id", job["office_id"])
    if job.get("data_source_id"):
        query = query.eq("data_source_id", job["data_source_id"])
    students = query.order("source_row_number").execute().data or []
    students = [s for s in students if str(s.get("application_status") or "").strip() not in FINAL_STATUSES and s.get("login_identifier") and s.get("encrypted_password")]
    if not students:
        set_fallback_job_status(job_id, "done")
        return
    total = len(students)
    technical_errors = 0
    for index, student in enumerate(students, start=1):
        name = str(student.get("student_name") or student.get("login_identifier") or "").strip()
        session = None
        status = ""
        try:
            password = decrypt_student_password(student["encrypted_password"])
            session, csrf_token, login_error = fallback_api_login(student["login_identifier"], password)
            if login_error:
                status = "فشل تسجيل الدخول" if "كود:" in login_error else "خطأ فني في الفحص"
                technical_errors += 1
            else:
                status = fallback_api_status(session, csrf_token)
                if status.startswith("خطأ"):
                    technical_errors += 1
        except Exception as exc:
            technical_errors += 1
            status = "خطأ فني في الفحص"
            print(f"Streamlit fallback error for {name}: {exc}")
        finally:
            fallback_api_logout(session)
        stamp = now_iso()
        db().table("student_records").update({"application_status": str(status), "status_updated_at": stamp, "updated_at": stamp}).eq("id", student["id"]).execute()
        db().table("job_progress").insert({"job_id": job_id, "student_index": index, "total": total, "student_name": name, "status": str(status)}).execute()
    if technical_errors < total:
        set_fallback_job_status(job_id, "done")
    else:
        set_fallback_job_status(job_id, "failed", "فشل فني في كل الطلاب")
    log_activity(job.get("office_id"), "اكتمل تحديث حالات الطلاب عبر Streamlit fallback (Legacy API)", job.get("file_name") or "", {"job_id": job_id, "students_processed": total, "technical_errors": technical_errors}, data_source_id=job.get("data_source_id"))

def wait_for_worker_or_fallback(job_id):
    deadline = time.monotonic() + WORKER_WAIT_SECONDS
    status_box = st.empty()
    progress_box = st.progress(0.0)
    while time.monotonic() < deadline:
        current = get_job(job_id)
        if not current:
            progress_box.empty()
            status_box.error("المهمة اختفت من Supabase.")
            return "missing"
        status = str(current.get("status") or "pending")
        if status != "pending":
            progress_box.empty()
            status_box.success("الـ Worker استلم المهمة.")
            return "worker"
        elapsed = int(WORKER_WAIT_SECONDS - max(0, deadline - time.monotonic()))
        remaining = max(0, WORKER_WAIT_SECONDS - elapsed)
        status_box.info(f"بندور على الـ Worker... لو مش موجود، Streamlit هيبدأ تلقائيًا بعد {remaining} ثانية.")
        progress_box.progress(min(elapsed / WORKER_WAIT_SECONDS, 1.0))
        time.sleep(FALLBACK_POLL_INTERVAL_SECONDS)
    status_box.warning("الـ Worker ما استلمش المهمة خلال 30 ثانية — Streamlit بيبدأ التحديث مباشرة بالطريقة القديمة.")
    claimed = claim_job_for_streamlit(job_id)
    progress_box.empty()
    if claimed:
        process_job_with_streamlit_fallback(claimed)
        return "fallback"
    current = get_job(job_id)
    return "worker" if current and current.get("status") != "pending" else "claim_failed"
