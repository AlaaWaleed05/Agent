'''
          new = '''    elif st.button("▶ تحديث حالات الطلاب",key="start_main"):
        st.session_state.update_locked=True
        try:
            is_gsheet_source=bool(saved_link and source=="🔗 ربط Google Sheets")
            source_type="gsheet" if is_gsheet_source else "xlsx"
