name: Fix Google credentials

on:
  push:
    paths:
      - '.github/workflows/fix-google-credentials.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Streamlit Google credentials
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('streamlit_app (7).py')
          s = p.read_text(encoding='utf-8')

          old = '''def get_gsheet_client():

    if gspread is None or Credentials is None:
        raise RuntimeError(
            "Google Sheets libraries unavailable"
        )

    creds = Credentials.from_service_account_info(
        st.secrets["gcp_service_account"],
        scopes=[
            "https://spreadsheets.google.com/feeds",
            "https://www.googleapis.com/auth/drive",
        ],
    )

    return gspread.authorize(creds)
'''

          new = '''def get_gsheet_client():

    if gspread is None or Credentials is None:
        raise RuntimeError(
            "Google Sheets libraries unavailable"
        )

    creds = get_google_credentials([
        "https://spreadsheets.google.com/feeds",
        "https://www.googleapis.com/auth/drive",
    ])

    return gspread.authorize(creds)
'''

          if old not in s:
              raise SystemExit('get_gsheet_client block not found')
          s = s.replace(old, new, 1)

          old2 = '''def get_google_credentials(scopes):

    creds_dict = st.secrets.get(
        "gcp_service_account"
    )

    if isinstance(creds_dict, dict):

        return (
            Credentials
            .from_service_account_info(
                creds_dict,
                scopes=scopes
            )
        )

    raw = st.secrets.get(
        "GCP_SERVICE_ACCOUNT_JSON",
        os.getenv("GCP_SERVICE_ACCOUNT_JSON")
    )

    if raw:

        return (
            Credentials
            .from_service_account_info(
                json.loads(raw),
                scopes=scopes
            )
        )

    raise RuntimeError(
        "Google service account configuration missing"
    )
'''

          new2 = '''def get_google_credentials(scopes):

    # Streamlit secrets TOML sections are AttrDict-like objects,
    # not always plain dict instances. Normalize them before passing
    # them to google-auth so [gcp_service_account] works reliably.
    creds_dict = st.secrets.get("gcp_service_account")

    if creds_dict:
        try:
            creds_dict = dict(creds_dict)
        except Exception:
            pass

        if hasattr(creds_dict, "get") and creds_dict.get("client_email") and creds_dict.get("private_key"):
            return Credentials.from_service_account_info(
                creds_dict,
                scopes=scopes
            )

    raw = st.secrets.get(
        "GCP_SERVICE_ACCOUNT_JSON",
        os.getenv("GCP_SERVICE_ACCOUNT_JSON")
    )

    if raw:
        data = json.loads(raw) if isinstance(raw, str) else dict(raw)
        return Credentials.from_service_account_info(
            data,
            scopes=scopes
        )

    raw = st.secrets.get(
        "GOOGLE_SERVICE_ACCOUNT_JSON",
        os.getenv("GOOGLE_SERVICE_ACCOUNT_JSON")
    )

    if raw:
        data = json.loads(raw) if isinstance(raw, str) else dict(raw)
        return Credentials.from_service_account_info(
            data,
            scopes=scopes
        )

    credentials_file = os.getenv("GOOGLE_APPLICATION_CREDENTIALS")
    if credentials_file:
        return Credentials.from_service_account_file(
            credentials_file,
            scopes=scopes
        )

    raise RuntimeError(
        "Google service account configuration missing"
    )
'''

          if old2 not in s:
              raise SystemExit('get_google_credentials block not found')
          s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'streamlit_app (7).py'
          git diff --cached --quiet || git commit -m 'Fix Streamlit Google service account loading'
          git push
