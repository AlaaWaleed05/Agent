name: Fix Google credentials

on:
  push:
    paths:
      - '.github/workflows/fix-google-credentials.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Streamlit Google credentials
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          p = Path('streamlit_app (7).py')
          s = p.read_text(encoding='utf-8')

          old = '''def get_google_credentials(scopes):

    creds_dict = st.secrets.get(
        "gcp_service_account"
    )

    if isinstance(creds_dict, dict):

        return (
            Credentials
            .from_service_account_info(
                creds_dict,
                scopes=scopes
            )
        )

    raw = st.secrets.get(
        "GCP_SERVICE_ACCOUNT_JSON",
        os.getenv("GCP_SERVICE_ACCOUNT_JSON")
    )

    if raw:

        return (
            Credentials
            .from_service_account_info(
                json.loads(raw),
                scopes=scopes
            )
        )

    raise RuntimeError(
        "Google service account configuration missing"
    )
'''

          new = '''def get_google_credentials(scopes):

    if Credentials is None:
        raise RuntimeError(
            "Google credentials libraries unavailable"
        )

    creds_dict = st.secrets.get("gcp_service_account")

    if creds_dict:
        try:
            creds_dict = dict(creds_dict)
        except Exception:
            pass

        if (
            hasattr(creds_dict, "get")
            and creds_dict.get("client_email")
            and creds_dict.get("private_key")
        ):
            return Credentials.from_service_account_info(
                creds_dict,
                scopes=scopes
            )

    raw = st.secrets.get(
        "GCP_SERVICE_ACCOUNT_JSON",
        os.getenv("GCP_SERVICE_ACCOUNT_JSON")
    )

    if raw:
        data = (
            json.loads(raw)
            if isinstance(raw, str)
            else dict(raw)
        )
        return Credentials.from_service_account_info(
            data,
            scopes=scopes
        )

    raw = st.secrets.get(
        "GOOGLE_SERVICE_ACCOUNT_JSON",
        os.getenv("GOOGLE_SERVICE_ACCOUNT_JSON")
    )

    if raw:
        data = (
            json.loads(raw)
            if isinstance(raw, str)
            else dict(raw)
        )
        return Credentials.from_service_account_info(
            data,
            scopes=scopes
        )

    credentials_file = os.getenv(
        "GOOGLE_APPLICATION_CREDENTIALS"
    )

    if credentials_file:
        return Credentials.from_service_account_file(
            credentials_file,
            scopes=scopes
        )

    raise RuntimeError(
        "Google service account configuration missing"
    )
'''

          if old in s:
              s = s.replace(old, new, 1)

          old_drive = '''def get_google_credentials(scopes):

    if Credentials is None:
        raise RuntimeError(
            "Google credentials libraries unavailable"
        )

    creds_dict = st.secrets.get(
        "gcp_service_account"
    )

    if isinstance(creds_dict, dict):

        return (
            Credentials
            .from_service_account_info(
                creds_dict,
                scopes=scopes
            )
        )

    raw = st.secrets.get(
        "GCP_SERVICE_ACCOUNT_JSON",
        os.getenv("GCP_SERVICE_ACCOUNT_JSON")
    )

    if raw:

        return (
            Credentials
            .from_service_account_info(
                json.loads(raw),
                scopes=scopes
            )
        )

    raise RuntimeError(
        "Google service account configuration missing"
    )
'''

          marker = '# =========================================================\n# GOOGLE DRIVE\n# =========================================================\n'
          if marker in s:
              before, after = s.split(marker, 1)
              if old_drive in after:
                  after = after.replace(old_drive, new, 1)
                  s = before + marker + after

          py_compile.compile(str(p), doraise=True)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate syntax
        run: python -m py_compile 'streamlit_app (7).py'
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'streamlit_app (7).py'
          git diff --cached --quiet || git commit -m 'Fix Google Drive service account loading'
          git push
