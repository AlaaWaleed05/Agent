name: Fix Aivora Worker Drive imports

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/fix_worker_drive_imports.py
      - run: |
          python -m py_compile worker.py
          python -m py_compile 'streamlit_app (7).py'
      - run: |
          rm -f scripts/fix_worker_drive_imports.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.py
          git commit -m 'Fix Worker Drive output imports' || true
          git push
