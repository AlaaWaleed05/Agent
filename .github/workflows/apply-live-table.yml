name: Validate Aivora

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run one-time Excel patch
        if: hashFiles('.github/excel_patch_once.py') != ''
        run: python .github/excel_patch_once.py

      - name: Compile Streamlit app
        run: python -m py_compile 'streamlit_app (7).py'

      - name: Compile Worker
        run: python -m py_compile worker.py

      - name: Commit Excel patch only when the patch script exists
        if: hashFiles('.github/excel_patch_once.py') == '' && hashFiles('.github/excel_live_marker.txt') == ''
        shell: bash
        run: |
          if git diff --quiet && git status --porcelain | grep -qv '^??'; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'streamlit_app (7).py' worker.py .github/workflows/apply-live-table.yml
          git diff --cached --quiet || git commit -m 'Fix Excel live status update [skip ci]'
          git push origin main
