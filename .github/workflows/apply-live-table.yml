name: Validate Aivora

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Excel-only live patch
        if: hashFiles('.github/excel_live_marker.txt') != ''
        shell: python
        run: |
          from pathlib import Path

          app = Path('streamlit_app (7).py')
          worker = Path('worker.py')

          def replace_block(text, start, end, replacement):
              a = text.find(start)
              if a < 0:
                  raise RuntimeError(f'start marker not found: {start}')
              b = text.find(end, a + len(start))
              if b < 0:
                  raise RuntimeError(f'end marker not found: {end}')
              return text[:a] + replacement.rstrip() + '\n\n' + text[b:]

          app_text = app.read_text(encoding='utf-8')
          app_live = '''# =========================================================
# LIVE EXCEL UPDATE
# SAME DRIVE FILE
# =========================================================

def update_excel_student_status(source_ref, student, status):
    source_ref = _excel_text(source_ref)
    if not source_ref:
        raise RuntimeError('excel_source_missing')

    file_bytes = download_drive_file_bytes(source_ref)
    if not file_bytes:
        raise RuntimeError('excel_download_empty')

    wb = openpyxl.load_workbook(io.BytesIO(file_bytes), data_only=False)
    ws = wb.active
    cols, header_row = _find_excel_layout(ws)
    email_col = cols['email']

    status_col = cols.get('status')
    if status_col is None:
        status_col = ws.max_column + 1
        ws.cell(header_row, status_col).value = 'حالة الطلب'

    login = _excel_text(student.get('login_identifier')).casefold()
    source_row = student.get('source_row_number')
    target_row = None

    if source_row:
        candidate = int(source_row)
        if header_row < candidate <= ws.max_row:
            target_row = candidate

    if target_row is not None and login:
        row_login = _excel_text(ws.cell(target_row, email_col).value).casefold()
        if row_login != login:
            target_row = None

    if target_row is None and login:
        for row_idx in range(header_row + 1, ws.max_row + 1):
            row_login = _excel_text(ws.cell(row_idx, email_col).value).casefold()
            if row_login == login:
                target_row = row_idx
                break

    if target_row is None:
        raise RuntimeError(f'excel_student_row_not_found:{login}')

    ws.cell(target_row, status_col).value = _excel_text(status)

    output = io.BytesIO()
    wb.save(output)
    output.seek(0)
    updated_bytes = output.getvalue()
    if not updated_bytes:
        raise RuntimeError('excel_output_empty')

    service = drive_service()
    media = MediaIoBaseUpload(
        io.BytesIO(updated_bytes),
        mimetype='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
        resumable=False,
    )
    result = service.files().update(
        fileId=source_ref,
        media_body=media,
        supportsAllDrives=True,
        fields='id,modifiedTime,size,mimeType,name',
    ).execute()

    if str(result.get('id') or '').strip() != source_ref:
        raise RuntimeError('excel_drive_update_wrong_file')

    safe_log(f"Live Excel update: {student.get('student_name')} -> {status}")
'''
          app_text = replace_block(
              app_text,
              '# =========================================================\n# LIVE EXCEL UPDATE\n# SAME DRIVE FILE\n# =========================================================',
              '# =========================================================\n# LIVE GOOGLE SHEET UPDATE\n# SAME SHEET\n# =========================================================',
              app_live,
          )
          app.write_text(app_text, encoding='utf-8')

          worker_text = worker.read_text(encoding='utf-8')
          worker_live = '''# ============================================================
# LIVE EXCEL UPDATE
# ============================================================

def update_excel_student_status(source_ref, student, status):
    source_ref = _excel_text(source_ref)
    if not source_ref:
        raise RuntimeError('excel_source_missing')

    file_bytes = download_drive_file_bytes(source_ref)
    if not file_bytes:
        raise RuntimeError('excel_download_empty')

    wb = openpyxl.load_workbook(io.BytesIO(file_bytes), data_only=False)
    ws = wb.active
    cols, header_row = find_excel_columns_for_output(ws)
    status_col = find_status_column(ws, header_row)

    login = _excel_text(student.get('login_identifier')).casefold()
    source_row = student.get('source_row_number')
    target_row = None

    if source_row:
        candidate = int(source_row)
        if header_row < candidate <= ws.max_row:
            target_row = candidate

    if target_row is not None and login:
        row_login = _excel_text(ws.cell(target_row, cols['email'] + 1).value).casefold()
        if row_login != login:
            target_row = None

    if target_row is None and login:
        for row_idx in range(header_row + 1, ws.max_row + 1):
            row_login = _excel_text(ws.cell(row_idx, cols['email'] + 1).value).casefold()
            if row_login == login:
                target_row = row_idx
                break

    if target_row is None:
        raise RuntimeError(f'excel_student_row_not_found:{login}')

    ws.cell(target_row, status_col).value = _excel_text(status)

    output = io.BytesIO()
    wb.save(output)
    output.seek(0)
    updated_bytes = output.getvalue()
    if not updated_bytes:
        raise RuntimeError('excel_output_empty')

    service = drive_service()
    media = MediaIoBaseUpload(
        io.BytesIO(updated_bytes),
        mimetype='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
        resumable=False,
    )
    result = service.files().update(
        fileId=source_ref,
        media_body=media,
        supportsAllDrives=True,
        fields='id,modifiedTime,size,mimeType,name',
    ).execute()

    if str(result.get('id') or '').strip() != source_ref:
        raise RuntimeError('excel_drive_update_wrong_file')

    print(f'[EXCEL] SUCCESS file={source_ref} row={target_row} status={status}')
'''
          worker_text = replace_block(
              worker_text,
              '# ============================================================\n# LIVE EXCEL UPDATE\n# ============================================================',
              '# ============================================================\n# LIVE GOOGLE SHEET UPDATE\n# ============================================================',
              worker_live,
          )
          worker.write_text(worker_text, encoding='utf-8')

      - name: Compile Streamlit app
        run: python -m py_compile 'streamlit_app (7).py'

      - name: Compile Worker
        run: python -m py_compile worker.py

      - name: Commit Excel patch only when marker exists
        if: hashFiles('.github/excel_live_marker.txt') != ''
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/excel_live_marker.txt
          git checkout HEAD~0 -- .github/workflows/apply-live-table.yml
          git add 'streamlit_app (7).py' worker.py .github/workflows/apply-live-table.yml
          git commit -m 'Fix Excel live status update [skip ci]'
          git push origin main
