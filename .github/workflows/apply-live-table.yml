name: Validate Aivora

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply worker runtime fix once
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('worker.py')
          s = p.read_text(encoding='utf-8')

          if 'EXCEL_BUCKET = "excel-files"' not in s:
              marker = '''DRIVE_FOLDER_ID = (
              os.environ.get("DRIVE_FOLDER_ID")
              or "12L_qSHBnW4-tfQZRteynInWNBAML016f"
          )
          '''
              if marker not in s:
                  raise RuntimeError('worker constants marker not found')
              s = s.replace(marker, marker + '\nEXCEL_BUCKET = "excel-files"\n', 1)

          pattern = r'def update_excel_student_status\(source_ref, student, status\):.*?(?=\n\n# ============================================================\n# LIVE GOOGLE SHEET UPDATE)'
          replacement = '''def update_excel_student_status(source_ref, student, status):
              source_ref = _excel_text(source_ref)
              if not source_ref:
                  raise RuntimeError("excel_source_missing")

              file_bytes = (
                  db.storage
                  .from_(EXCEL_BUCKET)
                  .download(source_ref)
              )
              if not file_bytes:
                  raise RuntimeError("excel_download_empty")

              wb = openpyxl.load_workbook(
                  io.BytesIO(file_bytes),
                  data_only=False
              )
              ws = wb.active

              cols, header_row = find_excel_columns_for_output(ws)
              status_col = find_status_column(ws, header_row)

              login = _excel_text(
                  student.get("login_identifier")
              ).casefold()
              source_row = student.get("source_row_number")
              target_row = None

              if source_row:
                  candidate = int(source_row)
                  if header_row < candidate <= ws.max_row:
                      candidate_login = _excel_text(
                          ws.cell(candidate, cols["email"] + 1).value
                      ).casefold()
                      if candidate_login == login:
                          target_row = candidate

              if target_row is None and login:
                  for row_idx in range(header_row + 1, ws.max_row + 1):
                      row_login = _excel_text(
                          ws.cell(row_idx, cols["email"] + 1).value
                      ).casefold()
                      if row_login == login:
                          target_row = row_idx
                          break

              if target_row is None:
                  raise RuntimeError("excel_student_row_missing")

              ws.cell(target_row, status_col).value = str(status or "")

              output = io.BytesIO()
              wb.save(output)
              updated_bytes = output.getvalue()
              if not updated_bytes:
                  raise RuntimeError("excel_updated_file_empty")

              db.storage.from_(EXCEL_BUCKET).upload(
                  source_ref,
                  updated_bytes,
                  {
                      "content-type": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                      "upsert": "true",
                  },
              )

              print(
                  f"    ✓ Excel live update: {student.get('student_name') or login}"
              )
          '''
          s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise RuntimeError('worker live Excel updater not found')

          # Do not intentionally restart Chrome between students.
          s = s.replace('if needs_browser_restart:', 'if False and needs_browser_restart:')

          compile(s, 'worker.py', 'exec')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Compile Streamlit app
        run: python -m py_compile 'streamlit_app (7).py'

      - name: Compile Worker
        run: python -m py_compile worker.py

      - name: Persist worker fix
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- worker.py; then
            echo 'Worker already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.py
          git commit -m 'Fix worker Excel storage and single-browser lifecycle'
          git push origin main
