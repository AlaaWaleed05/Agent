name: Apply live table
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/live_progress_patch.py
      - run: python -m py_compile 'streamlit_app (7).py'
      - run: git config user.name github-actions[bot]
      - run: git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - run: git add 'streamlit_app (7).py'
      - run: git commit -m 'Show every student status live' || true
      - run: git push
