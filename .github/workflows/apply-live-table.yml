name: Aivora retry restore

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore retry behavior
        shell: bash
        run: |
          python scripts/restore_retry_behavior.py
          python -m py_compile 'streamlit_app (7).py'
          python -m py_compile worker.py
          cat > .github/workflows/apply-live-table.yml <<'YAML'
          name: Validate Aivora

          on:
            push:
              branches:
                - main
            pull_request:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Set up Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: '3.11'

                - name: Compile Streamlit app
                  run: python -m py_compile 'streamlit_app (7).py'

                - name: Compile Worker
                  run: python -m py_compile worker.py
          YAML
          rm -f scripts/restore_retry_behavior.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.py 'streamlit_app (7).py' .github/workflows/apply-live-table.yml scripts/restore_retry_behavior.py
          git commit -m 'Restore technical retry for Worker and fallback' || true
          git push
