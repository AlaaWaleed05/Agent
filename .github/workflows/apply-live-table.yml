name: Aivora retry restore

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore retry behavior
        shell: bash
        run: |
          python scripts/restore_retry_behavior.py
          python -m py_compile 'streamlit_app (7).py'
          python -m py_compile worker.py
          rm -f scripts/restore_retry_behavior.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker.py 'streamlit_app (7).py' scripts/restore_retry_behavior.py
          git commit -m 'Restore technical retry for Worker and fallback' || true
          git push
