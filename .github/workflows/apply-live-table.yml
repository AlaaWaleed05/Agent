name: Apply live table
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - run: git checkout d4b21f98035c742c374e641e4fa1cdf5d3c43f1e -- 'streamlit_app (7).py'
      - run: python scripts/live_progress_patch.py
      - run: python scripts/fallback_email_patch.py
      - run: python scripts/worker_timing_patch.py
      - run: python -m py_compile 'streamlit_app (7).py'
      - run: python -m py_compile worker.py
      - run: git config user.name github-actions[bot]
      - run: git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - run: git add 'streamlit_app (7).py' worker.py scripts/worker_timing_patch.py
      - run: git commit -m 'Restore app and optimize Worker timing and recovery' || true
      - run: git push
