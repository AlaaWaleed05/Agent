name: Run Excel fix now

on:
  push:
    branches: [main]
    paths:
      - '.github/excel_fix_now.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply Excel-only fix
        run: python .github/excel_fix_now.py
      - name: Validate
        run: python -m py_compile 'streamlit_app (7).py'
      - name: Commit Excel file only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'streamlit_app (7).py'
          git diff --cached --quiet || git commit -m 'Fix Excel Drive upload'
          git push origin main
