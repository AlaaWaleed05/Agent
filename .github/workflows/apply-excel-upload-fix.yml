name: Apply Excel upload fix

on:
  push:
    branches: [main]
    paths:
      - '.github/excel_upload_fix.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch only Excel upload code
        run: python .github/excel_upload_fix.py

      - name: Validate Python
        run: python -m py_compile 'streamlit_app (7).py'

      - name: Commit only the Excel fix and remove temporary patch files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'streamlit_app (7).py'
          git rm -f .github/excel_upload_fix.py .github/workflows/apply-excel-upload-fix.yml
          git diff --cached --quiet || git commit -m 'Fix Excel Drive upload'
          git push origin main
