name: Apply Aivora runtime fix

on:
  push:
    paths:
      - ".github/aivora_runtime_fix_trigger.txt"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply runtime fix
        run: python scripts/apply_runtime_fix.py

      - name: Compile patched files
        run: |
          python -m py_compile "streamlit_app (7).py"
          python -m py_compile worker.py

      - name: Commit patched application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.py "streamlit_app (7).py"
          git rm -f scripts/apply_runtime_fix.py .github/aivora_runtime_fix_trigger.txt .github/workflows/apply-runtime-fix.yml
          git commit -m "Fix worker lifecycle, cancellation, and Excel handling"
          git push origin main
