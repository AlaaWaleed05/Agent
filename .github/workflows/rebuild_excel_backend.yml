name: Rebuild Excel backend

on:
  push:
    paths:
      - 'streamlit_app (7).py'
      - 'worker.py'
      - '.github/excel_rebuild_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Excel only
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('streamlit_app (7).py')
          worker = Path('worker.py')

          APP_EXCEL = r'''# =========================================================
          # EXCEL
          # =========================================================

          def _excel_text(value):
              return "" if value is None else str(value).strip()

          def _excel_normalize_header(value):
              value = _excel_text(value).lower()
              return re.sub(r"[\s_\-]+", "", value)

          def _excel_header_kind(value):
              low = _excel_normalize_header(value)
              if ("email" in low or "mail" in low or
                      any(x in low for x in ("بريد", "ايميل", "إيميل", "يميل"))):
                  return "email"
              if ("password" in low or "pass" in low or
                      any(x in low for x in ("باسورد", "كلمةالمرور", "كلمهالمرور", "كلمةالسر", "كلمهالسر"))):
                  return "password"
              if "name" in low or "اسم" in low:
                  return "name"
              if (low in {"حالةالطلب", "الحالة", "status"} or
                      ("حالة" in low and "اسم" not in low and "خدمة" not in low)):
                  return "status"
              return None

          def _find_excel_layout(ws):
              best = None
              for row_idx in range(1, min(20, ws.max_row) + 1):
                  found = {}
                  for col_idx, cell in enumerate(ws[row_idx], start=1):
                      kind = _excel_header_kind(cell.value)
                      if kind and kind not in found:
                          found[kind] = col_idx
                  score = ((2 if "email" in found else 0) +
                           (2 if "password" in found else 0) +
                           (1 if "name" in found else 0) +
                           (1 if "status" in found else 0))
                  if score >= 4 and "email" in found and "password" in found:
                      return found, row_idx
                  if best is None or score > best[0]:
                      best = (score, found, row_idx)
              if best and "email" in best[1] and "password" in best[1]:
                  return best[1], best[2]
              raise ValueError("ملف Excel لازم يحتوي على أعمدة الإيميل والباسورد.")

          def find_excel_columns(ws):
              cols, header_row = _find_excel_layout(ws)
              return {
                  "name": cols.get("name", cols["email"]) - 1,
                  "email": cols["email"] - 1,
                  "password": cols["password"] - 1,
              }, header_row

          def find_status_column_for_output(ws, header_row):
              cols, _ = _find_excel_layout(ws)
              if "status" in cols:
                  return cols["status"]
              new_col = ws.max_column + 1
              ws.cell(header_row, new_col).value = "حالة الطلب"
              return new_col

          def parse_excel_bytes(file_bytes):
              if not file_bytes:
                  raise ValueError("ملف Excel غير موجود.")
              try:
                  wb = openpyxl.load_workbook(io.BytesIO(file_bytes), data_only=False, read_only=False)
              except Exception as exc:
                  raise ValueError("تعذر قراءة ملف Excel. استخدمي ملف .xlsx صالح.") from exc

              ws = wb.active
              cols, header_row = find_excel_columns(ws)
              records = []
              seen = set()

              for excel_row, row in enumerate(
                  ws.iter_rows(min_row=header_row + 1, values_only=True),
                  start=header_row + 1,
              ):
                  values = list(row)

                  def cell_at(key):
                      idx = cols[key]
                      return _excel_text(values[idx]) if idx < len(values) else ""

                  email = cell_at("email")
                  password = cell_at("password")
                  name = cell_at("name") or email
                  key = email.casefold()

                  if not email or not password or key in seen:
                      continue

                  seen.add(key)
                  records.append({
                      "source_row_number": excel_row,
                      "student_name": name,
                      "login_identifier": email,
                      "password": password,
                      "original_data": {
                          f"column_{i + 1}": _excel_text(value)
                          for i, value in enumerate(values)
                      },
                  })

              if not records:
                  raise ValueError("مش لاقي طلاب عندهم إيميل وباسورد صالحين في ملف Excel.")
              return records

          def build_updated_excel(file_bytes, students):
              if not file_bytes:
                  raise ValueError("ملف Excel غير موجود.")
              wb = openpyxl.load_workbook(io.BytesIO(file_bytes), data_only=False)
              ws = wb.active
              cols, header_row = find_excel_columns(ws)
              status_col = find_status_column_for_output(ws, header_row)
              by_login = {}
              by_row = {}

              for student in students:
                  login = _excel_text(student.get("login_identifier")).casefold()
                  status = _excel_text(student.get("application_status"))
                  if login and status:
                      by_login[login] = status
                  if student.get("source_row_number") and status:
                      by_row[int(student["source_row_number"])] = status

              for row_idx in range(header_row + 1, ws.max_row + 1):
                  email = _excel_text(ws.cell(row_idx, cols["email"] + 1).value).casefold()
                  status = by_login.get(email) or by_row.get(row_idx)
                  if status:
                      ws.cell(row_idx, status_col).value = status

              output = io.BytesIO()
              wb.save(output)
              output.seek(0)
              return output.getvalue()

          # =========================================================
          # END EXCEL
          # ========================================================='''

          WORKER_EXCEL = r'''# ============================================================
          # GOOGLE DRIVE / EXCEL
          # ============================================================

          def _excel_text(value):
              return "" if value is None else str(value).strip()

          def _excel_normalize_header(value):
              value = _excel_text(value).lower()
              return re.sub(r"[\s_\-]+", "", value)

          def _excel_header_kind(value):
              low = _excel_normalize_header(value)
              if ("email" in low or "mail" in low or
                      any(x in low for x in ("بريد", "ايميل", "إيميل", "يميل"))):
                  return "email"
              if ("password" in low or "pass" in low or
                      any(x in low for x in ("باسورد", "كلمةالمرور", "كلمهالمرور", "كلمةالسر", "كلمهالسر"))):
                  return "password"
              if "name" in low or "اسم" in low:
                  return "name"
              if (low in {"حالةالطلب", "الحالة", "status"} or
                      ("حالة" in low and "اسم" not in low and "خدمة" not in low)):
                  return "status"
              return None

          def _find_excel_layout(ws):
              best = None
              for row_idx in range(1, min(20, ws.max_row) + 1):
                  found = {}
                  for col_idx, cell in enumerate(ws[row_idx], start=1):
                      kind = _excel_header_kind(cell.value)
                      if kind and kind not in found:
                          found[kind] = col_idx
                  score = ((2 if "email" in found else 0) +
                           (2 if "password" in found else 0) +
                           (1 if "name" in found else 0) +
                           (1 if "status" in found else 0))
                  if score >= 4 and "email" in found and "password" in found:
                      return found, row_idx
                  if best is None or score > best[0]:
                      best = (score, found, row_idx)
              if best and "email" in best[1] and "password" in best[1]:
                  return best[1], best[2]
              raise RuntimeError("excel_columns_missing")

          def find_excel_columns_for_output(ws):
              cols, header_row = _find_excel_layout(ws)
              return {
                  "name": cols.get("name", cols["email"]) - 1,
                  "email": cols["email"] - 1,
                  "password": cols["password"] - 1,
              }, header_row

          def find_status_column(ws, header_row):
              cols, _ = _find_excel_layout(ws)
              if "status" in cols:
                  return cols["status"]
              new_col = ws.max_column + 1
              ws.cell(header_row, new_col).value = "حالة الطلب"
              return new_col

          def download_drive_file_bytes(file_id):
              file_id = _excel_text(file_id)
              if not file_id:
                  raise RuntimeError("excel_source_missing")
              service = drive_service()
              buffer = io.BytesIO()
              request = service.files().get_media(fileId=file_id, supportsAllDrives=True)
              downloader = MediaIoBaseDownload(buffer, request)
              done = False
              while not done:
                  _, done = downloader.next_chunk()
              buffer.seek(0)
              data = buffer.getvalue()
              if not data:
                  raise RuntimeError("excel_download_empty")
              return data

          def upload_drive_file_bytes(file_bytes, filename):
              if not file_bytes:
                  raise RuntimeError("excel_upload_empty")
              service = drive_service()
              metadata = {"name": str(filename or "students.xlsx"), "parents": [DRIVE_FOLDER_ID]}
              media = MediaIoBaseUpload(
                  io.BytesIO(file_bytes),
                  mimetype="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                  resumable=False,
              )
              result = service.files().create(
                  body=metadata,
                  media_body=media,
                  supportsAllDrives=True,
                  fields="id",
              ).execute()
              file_id = str(result.get("id") or "").strip()
              if not file_id:
                  raise RuntimeError("excel_drive_upload_missing_id")
              return file_id

          def build_updated_excel(file_bytes, students):
              wb = openpyxl.load_workbook(io.BytesIO(file_bytes), data_only=False)
              ws = wb.active
              cols, header_row = find_excel_columns_for_output(ws)
              status_col = find_status_column(ws, header_row)
              by_login = {}
              by_row = {}
              for student in students:
                  login = _excel_text(student.get("login_identifier")).casefold()
                  status = _excel_text(student.get("application_status"))
                  if login and status:
                      by_login[login] = status
                  if student.get("source_row_number") and status:
                      by_row[int(student["source_row_number"])] = status
              for row_idx in range(header_row + 1, ws.max_row + 1):
                  email = _excel_text(ws.cell(row_idx, cols["email"] + 1).value).casefold()
                  status = by_login.get(email) or by_row.get(row_idx)
                  if status:
                      ws.cell(row_idx, status_col).value = status
              output = io.BytesIO()
              wb.save(output)
              output.seek(0)
              return output.getvalue()

          # ============================================================
          # END GOOGLE DRIVE / EXCEL
          # ============================================================'''

          def replace_block(text, start_marker, end_marker, replacement):
              start = text.find(start_marker)
              if start < 0:
                  raise RuntimeError(f"Excel start marker not found: {start_marker}")
              end = text.find(end_marker, start + len(start_marker))
              if end < 0:
                  raise RuntimeError(f"Excel end marker not found: {end_marker}")
              return text[:start] + replacement.rstrip() + "\n\n" + text[end:]

          app_text = app.read_text(encoding='utf-8')
          app_text = replace_block(
              app_text,
              '# =========================================================\n# EXCEL\n# =========================================================',
              '# =========================================================\n# GOOGLE DRIVE',
              APP_EXCEL,
          )

          # Excel-only hardening in import_students: require a real Drive id.
          old_excel_branch = '''    if source_type == "excel":\n\n        if not file_bytes:\n            raise ValueError(\n                "ملف Excel غير موجود."\n            )\n\n        file_path = upload_to_drive(\n            file_bytes,\n            source_name,\n            ""\n        )'''
          new_excel_branch = '''    if source_type == "excel":\n\n        if not file_bytes:\n            raise ValueError(\n                "ملف Excel غير موجود."\n            )\n\n        file_path = upload_to_drive(\n            file_bytes,\n            source_name,\n            ""\n        )\n\n        if not str(file_path or "").strip():\n            raise RuntimeError(\n                "excel_drive_upload_missing_id"\n            )'''
          if old_excel_branch not in app_text:
              raise RuntimeError('Expected Excel upload branch not found in streamlit_app (7).py')
          app_text = app_text.replace(old_excel_branch, new_excel_branch, 1)

          # Excel-only hardening in create_job: never create an Excel job with a UUID source ref.
          old_create = '''def create_job(\n    office_id,\n    source,\n    file_name\n):\n\n    return (\n        db()\n        .table("jobs")\n        .insert({\n            "office_id": office_id,\n            "data_source_id": source["id"],\n            "source_type": source["source_type"],\n            "source_ref":\n                source.get("file_path")\n                or source.get("source_url")\n                or source["id"],\n            "file_name": file_name,\n            "status": "pending",\n        })\n        .execute()\n        .data[0]\n    )'''
          new_create = '''def create_job(\n    office_id,\n    source,\n    file_name\n):\n\n    source_type = str(\n        source.get("source_type") or ""\n    ).strip().lower()\n\n    source_ref = (\n        str(source.get("file_path") or "").strip()\n        if source_type == "excel"\n        else str(\n            source.get("source_url")\n            or source.get("file_path")\n            or source["id"]\n        ).strip()\n    )\n\n    if source_type == "excel" and not source_ref:\n        raise RuntimeError(\n            "excel_source_missing"\n        )\n\n    return (\n        db()\n        .table("jobs")\n        .insert({\n            "office_id": office_id,\n            "data_source_id": source["id"],\n            "source_type": source["source_type"],\n            "source_ref": source_ref,\n            "file_name": file_name,\n            "status": "pending",\n        })\n        .execute()\n        .data[0]\n    )'''
          if old_create not in app_text:
              raise RuntimeError('Expected create_job block not found in streamlit_app (7).py')
          app_text = app_text.replace(old_create, new_create, 1)
          app.write_text(app_text, encoding='utf-8')

          worker_text = worker.read_text(encoding='utf-8')
          worker_text = replace_block(
              worker_text,
              '# ============================================================\n# GOOGLE DRIVE / EXCEL\n# ============================================================',
              '# ============================================================\n# GOOGLE SHEET - OLD BULK FUNCTION KEPT',
              WORKER_EXCEL,
          )

          # Replace only the live Excel updater; Google Sheet code remains untouched.
          live_start = '# ============================================================\n# LIVE EXCEL UPDATE\n# ============================================================'
          live_end = '# ============================================================\n# LIVE GOOGLE SHEET UPDATE\n# ============================================================'
          live_update = r'''# ============================================================
          # LIVE EXCEL UPDATE
          # ============================================================

          def update_excel_student_status(source_ref, student, status):
              source_ref = _excel_text(source_ref)
              if not source_ref:
                  raise RuntimeError("excel_source_missing")

              file_bytes = download_drive_file_bytes(source_ref)
              wb = openpyxl.load_workbook(io.BytesIO(file_bytes), data_only=False)
              ws = wb.active
              cols, header_row = find_excel_columns_for_output(ws)
              status_col = find_status_column(ws, header_row)

              login = _excel_text(student.get("login_identifier")).casefold()
              source_row = student.get("source_row_number")
              target_row = None

              if source_row:
                  candidate = int(source_row)
                  if header_row < candidate <= ws.max_row:
                      target_row = candidate

              if target_row is None and login:
                  for row_idx in range(header_row + 1, ws.max_row + 1):
                      email = _excel_text(ws.cell(row_idx, cols["email"] + 1).value).casefold()
                      if email == login:
                          target_row = row_idx
                          break

              if target_row is None:
                  raise RuntimeError(f"excel_student_row_not_found:{login}")

              ws.cell(target_row, status_col).value = _excel_text(status)

              output = io.BytesIO()
              wb.save(output)
              output.seek(0)
              updated_bytes = output.getvalue()
              if not updated_bytes:
                  raise RuntimeError("excel_output_empty")

              service = drive_service()
              media = MediaIoBaseUpload(
                  io.BytesIO(updated_bytes),
                  mimetype="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                  resumable=False,
              )
              result = service.files().update(
                  fileId=source_ref,
                  media_body=media,
                  supportsAllDrives=True,
                  fields="id,modifiedTime,size,mimeType,name",
              ).execute()

              if str(result.get("id") or "").strip() != source_ref:
                  raise RuntimeError("excel_drive_update_wrong_file")

              print(f"[EXCEL] SUCCESS file={source_ref} row={target_row} status={status}")

          # ============================================================'''
          worker_text = replace_block(worker_text, live_start, live_end, live_update)
          worker.write_text(worker_text, encoding='utf-8')

      - name: Validate Python syntax
        run: |
          python -m py_compile 'streamlit_app (7).py' worker.py

      - name: Commit only the Excel patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'streamlit_app (7).py' worker.py
          git rm -f '.github/excel_rebuild_trigger.txt' '.github/workflows/rebuild_excel_backend.yml' 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'Fix Excel upload and live status updates [skip ci]'
          git push
