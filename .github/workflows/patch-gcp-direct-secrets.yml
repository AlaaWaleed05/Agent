name: Temporary direct GCP secrets patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Google credentials loader
        run: |
          python .github/patch_gcp_direct_secrets.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "streamlit_app (7).py"
          git diff --cached --quiet || git commit -m "fix: support direct GCP secret variables [skip ci]"
          git push
