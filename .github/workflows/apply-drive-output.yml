name: Apply Aivora Drive output

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply Drive output changes
        run: python scripts/add_drive_output.py

      - name: Validate Python files
        run: |
          python -m py_compile 'streamlit_app (7).py'
          python -m py_compile worker.py

      - name: Commit code changes
        run: |
          rm -f scripts/add_drive_output.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'streamlit_app (7).py' worker.py
          git rm -f --cached scripts/add_drive_output.py 2>/dev/null || true
          git status --short
          git diff --cached --quiet && exit 0
          git commit -m 'Restore final Excel output via Drive'
          git push origin HEAD:main
