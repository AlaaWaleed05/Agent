name: Auto Update Student Status

on:
  schedule:
    # بيتشغل كل ساعة، والسكريبت نفسه بيقرر مين من المكاتب فعلاً محتاج تحديث
    # حسب "كل كام ساعة" اللي كل مكتب اختارها من الواجهة
    - cron: '0 * * * *'
  workflow_dispatch: {}  # يسمح بتشغيله يدويًا من تبويب Actions لو حبيت تجربه فورًا
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install gspread google-auth requests openpyxl google-api-python-client

      - name: Run auto update script
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
        run: python auto_update.py
